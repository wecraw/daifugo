name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator (§14) runs on the JVM; ubuntu-latest ships one, so
      # only the firebase CLI is needed, and it comes in as a dev dependency.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # `core` is the gate (§13): the suite includes the fuzz run over its fixed
      # seed set, and the coverage thresholds in packages/core/vitest.config.ts
      # fail the build rather than merely reporting a number.
      - run: npm run test:coverage
      - run: npm run test
      # The server suite again, this time under the Firestore emulator, so the
      # emulator-gated repository tests (§12.4) actually run (§14).
      - run: npm run test:emulator
